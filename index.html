<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b493d">
  <meta name="color-scheme" content="dark">
  <title>UV-K1 Map</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>UV-K1 Map</strong>
      <span id="statusLine">Hors ligne</span>
    </div>
    <div class="actions">
      <button id="connectBtn" class="primary" type="button">Connecter radio</button>
      <button id="disconnectBtn" type="button" disabled>Déconnecter</button>
      <button id="gpsBtn" type="button">GPS téléphone</button>
      <button id="prefetchBtn" type="button" disabled>Cache tuiles</button>
    </div>
  </header>

  <main>
    <div id="map" role="application" aria-label="Carte OpenStreetMap"></div>
    <aside class="panel" aria-label="Positions reçues">
      <h2>Cibles</h2>
      <ol id="targetList"></ol>
      <p class="hint">Fermez UV Studio et tout autre client série. Chrome Android + câble OTG data.</p>
    </aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
